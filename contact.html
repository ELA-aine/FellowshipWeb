<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Joshua Fellowship</title>
  <meta name="description" content="Get in touch, plan a visit, or send us a prayer request.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contact">
  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">Contact</span>
        <h1>We'd love to hear from you</h1>
        <p class="lead">Questions, prayer requests, or planning a first visit? Send us a note.</p>
      </div>
    </section>

    <section class="section">
      <div class="container contact-grid">
        <div class="reveal">
          <h2>Visit or reach out</h2>
          <div class="info-item">
            <div class="icon">📍</div>
            <div><b>Where</b><span data-site="address"></span></div>
          </div>
          <div class="info-item">
            <div class="icon">✉️</div>
            <div><b>Email</b><a data-site-mailto></a></div>
          </div>
          <div class="info-item">
            <div class="icon">🕒</div>
            <div><b>Gatherings</b></div>
          </div>
          <ul class="meet-list" data-meetings style="color:var(--ink)"></ul>
        </div>

        <form id="contact-form" class="card reveal">
          <label for="name">Your name</label>
          <input id="name" name="name" type="text" required autocomplete="name">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="email">
          <label for="message">Message</label>
          <textarea id="message" name="message" required placeholder="How can we help or pray for you?"></textarea>
          <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
          <button class="btn" type="submit">Send message</button>
          <p id="form-status" class="form-status" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="data/site.js"></script>
  <script src="js/main.js"></script>
  <script type="module" src="js/backend.js"></script>
</body>
</html>
