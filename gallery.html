<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery | Joshua Fellowship</title>
  <meta name="description" content="Photos from our fellowship gatherings, retreats and celebrations.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="gallery">
  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow" data-edit="gallery.gallery">Gallery</span>
        <h1 data-edit="gallery.moments-together">Moments together</h1>
        <p class="lead" data-edit="gallery.a-glimpse-of-life-in-our">A glimpse of life in our fellowship: worship, meals, laughter and service.</p>
      </div>
    </section>

    <div id="admin-tools" class="container admin-tools" hidden></div>

    <section id="albums-section" class="section" style="padding-bottom:1rem">
      <div class="container">
        <h2 data-edit="gallery.full-albums">Full albums</h2>
        <p class="lead" style="margin-bottom:2rem" data-edit="gallery.these-open-in-our-cloud-photo">These open in our cloud photo albums, where you can browse and download everything.</p>
        <div id="albums" class="albums"></div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <h2 data-edit="gallery.highlights">Highlights</h2>
        <div id="filters" class="filters"></div>
        <div id="photos" class="photos"></div>
      </div>
    </section>
  </main>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lb-btn lb-close" aria-label="Close">&times;</button>
    <button class="lb-btn lb-prev" aria-label="Previous photo">&#8249;</button>
    <img alt="">
    <p></p>
    <button class="lb-btn lb-next" aria-label="Next photo">&#8250;</button>
  </div>

  <footer id="site-footer"></footer>
  <script src="data/site.js"></script>
  <script src="data/zh.js"></script>
  <script src="js/i18n.js"></script>
  <script src="data/gallery.js"></script>
  <script src="js/main.js"></script>
  <script src="js/fit.js"></script>
  <script type="module" src="js/content.js"></script>
  <script type="module" src="js/gallery.js"></script>
</body>
</html>
