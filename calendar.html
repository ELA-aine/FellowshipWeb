<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar | Joshua Fellowship</title>
  <meta name="description" content="Our fellowship activities and church events.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="calendar">
  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow" data-edit="calendar.calendar">Calendar</span>
        <h1 data-edit="calendar.whats-happening">What's happening</h1>
        <p class="lead" data-edit="calendar.our-weekly-gatherings-fellowship-activit">Our weekly gatherings, fellowship activities and church events, all in one place.</p>
      </div>
    </section>

    <section class="section">
      <div class="container cal-layout">
        <div>
          <div class="cal-head">
            <h2 id="cal-title"></h2>
            <div class="cal-nav">
              <button id="cal-prev" class="chip" aria-label="Previous month">&#8249;</button>
              <button id="cal-today" class="chip">Today</button>
              <button id="cal-next" class="chip" aria-label="Next month">&#8250;</button>
            </div>
          </div>
          <div class="legend">
            <span><i class="dot weekly"></i>Weekly gathering</span>
            <span><i class="dot fellowship"></i>Fellowship activity</span>
            <span><i class="dot church"></i>Church event</span>
          </div>
          <div class="cal-weekdays" aria-hidden="true">
            <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
          </div>
          <div id="cal-grid" class="cal-grid"></div>
        </div>

        <aside>
          <div id="day-panel" class="card day-panel"></div>
          <h3 style="margin-top:2rem" data-edit="calendar.coming-up">Coming up</h3>
          <div id="upcoming-list" class="upcoming"></div>
        </aside>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="data/site.js"></script>
  <script src="data/zh.js"></script>
  <script src="js/i18n.js"></script>
  <script src="data/events.js"></script>
  <script src="js/main.js"></script>
  <script src="js/fit.js"></script>
  <script type="module" src="js/content.js"></script>
  <script type="module" src="js/calendar.js"></script>
</body>
</html>
